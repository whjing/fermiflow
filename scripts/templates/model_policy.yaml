# Generic free-parameter policy for `fermiflow model` or `--model-policy`.
# This is independent from the project YAML.

radial:
  # If this centre is omitted, each source's ROI_Center_Distance XML attribute
  # is used. Uncomment and replace both values for another reference centre.
  # center: {ra: 0.0, dec: 0.0}
  zones:
    - {max_radius: 3.0, policy: spectral}  # norm + fitted spectral shape
    - {max_radius: 5.0, policy: norm}      # normalization only
  outside_policy: fixed

# Keep the diffuse-background normalizations free.
background_norms: [gll_iem_v07, iso_P8R3_SOURCE_V3_v1]

# Explicit rules override radial rules. Names must exactly match the XML.
# sources:
#   my_target: spectral
#   nearby_source: norm

# Optional: apply a separate radial policy only to faint sources from a
# previous gtlike *_results.dat file.  If ``radial.center`` is set above, this
# block inherits it unless it supplies its own center.
# ts_filter:
#   results_file: ../products_1GeV/my_target_minuit_results.dat
#   threshold: 25.0
#   radial:
#     zones:
#       - {max_radius: 5.0, policy: norm}
#     outside_policy: fixed
#   # Used only if ts_filter.radial is omitted.
#   policy: fixed
