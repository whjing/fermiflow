[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "fermiflow"
version = "0.1.0"
description = "Small, reproducible helpers for Fermi-LAT analysis workflows."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Jing" }]
dependencies = []

[project.scripts]
fermiflow = "fermiflow:main"

[tool.setuptools]
py-modules = ["fermiflow"]
packages = ["scripts"]

[tool.setuptools.package-data]
scripts = ["*.sh", "templates/*.yaml"]
