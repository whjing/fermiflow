[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "fermiflow"
version = "0.1.0"
description = "Small, reproducible helpers for Fermi-LAT analysis workflows."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Jing" }]
dependencies = [
    "astropy",
    "fermipy",
    "LATSourceModel",
    "matplotlib",
    "numpy",
    "PyYAML",
    "regions",
]

[project.scripts]
fermiflow = "fermiflow:main"

[tool.setuptools]
py-modules = ["fermiflow"]
packages = ["scripts", "scripts.templates"]

[tool.setuptools.package-dir]
"scripts.templates" = "templates"

[tool.setuptools.package-data]
scripts = ["*.sh"]
"scripts.templates" = ["*.yaml"]
