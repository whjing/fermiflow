# Standalone XML free-parameter policy.  This file is not part of project.yaml.
# Use with: fermiflow model -- --input-model MODEL.xml --policy model_policy_radial.yaml
# Or:       fermiflow run -- --config project.yaml --mode like --input-model MODEL.xml --model-policy model_policy_radial.yaml

radial:
  # With no center here, the XML attribute ROI_Center_Distance is used.
  # Add center: {ra: ..., dec: ...} only to use a different center.
  zones:
    - {max_radius: 3.0, policy: all}
    - {max_radius: 5.0, policy: norm}
  outside_policy: fixed

background_norms: [gll_iem_v07, iso_P8R3_SOURCE_V3_v1]

# Explicit names override radial rules.
sources:
  kes27: all
